<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SGPT NUINF">
  <!-- Favicon do SGPT NUINF: mesmo ícone (lucide "network") e mesmas cores da
       marca usada no login / sidebar / error boundary — moldura no gradiente
       sky-900→sky-600 e o glifo em sky-300 (#7dd3fc). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c4a6e"/>
      <stop offset="0.55" stop-color="#075985"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <g transform="translate(4 4)" fill="none" stroke="#7dd3fc" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="16" width="6" height="6" rx="1"/>
    <rect x="2" y="16" width="6" height="6" rx="1"/>
    <rect x="9" y="2" width="6" height="6" rx="1"/>
    <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/>
    <path d="M12 12V8"/>
  </g>
</svg>
